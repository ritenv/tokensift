name: Release

on:
  push:
    branches: [main]
  # manual fallback: a push-to-main event can get dropped during a GitHub
  # Actions incident, and nothing retroactively re-fires a missed webhook.
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # trusted publishing needs a recent npm CLI to do the OIDC exchange;
      # pinned to 11.x on purpose, npm 12 drops the --git-checks flag that
      # @changesets/cli still passes internally, so "latest" breaks publish
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm changeset:version
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # only runs on a real publish, not when changesets/action just opened a
      # Version Packages PR; pulls this version's section straight out of the
      # changelog changesets already wrote, so the release notes and the
      # changelog never say different things
      - name: Create GitHub Release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          awk -v ver="## ${VERSION}" '
            $0 == ver { flag=1; next }
            /^## / && flag { exit }
            flag { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          gh release create "v${VERSION}" --title "v${VERSION}" --notes-file /tmp/release-notes.md
